name: smoke-qa

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke gate against QA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run smoke gate against QA
        run: npm run smoke
        env:
          API_BASE_URL: https://api-qa.wazoo.dev
          WORLDS_API_URL: https://data-qa.wazoo.dev
          WAZOO_PLATFORM_ADMIN_TOKEN: ${{ secrets.WAZOO_PLATFORM_ADMIN_TOKEN }}
